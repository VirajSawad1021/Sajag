- id: bank_or_wallet
  name_en: Your bank or wallet provider
  name_ne: तपाईंको बैंक वा वालेट कम्पनी
  url: null
  note_en: Contact them immediately, ask them to block the service if needed, and give them the transaction ID. Use the number in their official app or website, never one from the chat.
  note_ne: तुरुन्तै सम्पर्क गर्नुहोस्, आवश्यक परे सेवा रोक्न भन्नुहोस् र कारोबार नम्बर दिनुहोस्। च्याटमा दिइएको होइन, आधिकारिक एप वा वेबसाइटको नम्बर प्रयोग गर्नुहोस्।
  source: https://www.nrb.org.np/
  last_checked: 2026-10-10
