- id: nrb_gunaso
  name_en: Nepal Rastra Bank grievance portal
  name_ne: नेपाल राष्ट्र बैंक गुनासो पोर्टल
  url: https://gunaso.nrb.org.np/
  note_en: NRB's guidance — first complain to your bank or payment provider; if it is not resolved, register a grievance on this portal.
  note_ne: नेपाल राष्ट्र बैंकको निर्देशन — पहिले सम्बन्धित बैंक वा सेवा प्रदायकमा गुनासो गर्नुहोस्; समाधान नभएमा यो पोर्टलमा गुनासो दर्ता गर्नुहोस्।
  source: https://www.nrb.org.np/2026/08/%E0%A4%B5%E0%A4%BF%E0%A4%A6%E0%A5%8D%E0%A4%AF%E0%A5%81%E0%A4%A4%E0%A5%80%E0%A4%AF-%E0%A4%AD%E0%A5%81%E0%A4%95%E0%A5%8D%E0%A4%A4%E0%A4%BE%E0%A4%A8%E0%A5%80%E0%A4%AE%E0%A4%BE-%E0%A4%A0%E0%A4%97%E0%A5%80/
  last_checked: 2026-10-10
- id: cyber_bureau
  name_en: Nepal Police Cyber Bureau
  name_ne: नेपाल प्रहरी साइबर ब्युरो
  url: https://cyberbureau.nepalpolice.gov.np/report-cyber-crime/
  phones: ["9851286770", "01-5319044"]
  emails: ["cyberbureau@nepalpolice.gov.np"]
  note_en: There is no online form. Fill the Bureau's "Online Financial Fraud" application (typed or handwritten, Nepali or English), attach a copy of your citizenship/national ID/passport and the links (URLs) and clear screenshots, and submit it at your nearest district or ward police office or the Cyber Bureau office in Bhotahiti. If you cannot go in person, email everything to cyberbureau@nepalpolice.gov.np.
  note_ne: अनलाइन फारम छैन। "विद्युतीय माध्यम सम्बद्ध ठगी" को निवेदन (टाइप वा हस्तलिखित, नेपाली वा अंग्रेजी) भरी नागरिकता/राष्ट्रिय परिचयपत्र/राहदानीको प्रतिलिपि, लिङ्क (URL) र स्पष्ट स्क्रिनसट सहित नजिकको जिल्ला वा इलाका/वडा प्रहरी कार्यालय वा भोटाहिटीस्थित साइबर ब्युरोमा बुझाउनुहोस्। स्वयं उपस्थित हुन नसके cyberbureau@nepalpolice.gov.np मा इमेल गर्न सकिन्छ।
  form_url: https://cyberbureau.nepalpolice.gov.np/media/filer_public/a4/23/a42313cf-5545-4a6c-a5f9-7313fbbb7fd9/financila_fraud_application_2083_06_14.pdf
  source: https://cyberbureau.nepalpolice.gov.np/report-cyber-crime/
  last_checked: 2026-10-10
