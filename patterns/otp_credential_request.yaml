id: otp_credential_request
severity: high
title_en: Asks for OTP, PIN or password
title_ne: OTP, PIN वा पासवर्ड माग
description: Anyone asking for a one-time code, wallet PIN, MPIN or password.
why_en: A seller never needs your OTP or PIN to receive money. Sharing it can let someone take money out of your account.
why_ne: पैसा लिनका लागि बिक्रेतालाई तपाईंको OTP वा PIN कहिल्यै चाहिँदैन। यो दिँदा तपाईंको खाताबाट पैसा निकाल्न सकिन्छ।
not_always_scam_en: There is no normal shopping reason to share these. Treat as serious.
keywords:
  - otp
  - mpin
  - pin code
  - password
  - ओटीपी
  - पासवर्ड
  - code pathaunus
examples:
  - lang: rom-ne
    text: "Tapaiko phone ma aako OTP pathaunus, verify garnu parcha"
next_steps:
  - en: Do not share the code. If you already did, contact your bank or wallet provider immediately.
    ne: कोड नदिनुहोस्। दिइसक्नुभएको छ भने तुरुन्तै आफ्नो बैंक वा वालेट कम्पनीलाई सम्पर्क गर्नुहोस्।
    resource: bank_or_wallet