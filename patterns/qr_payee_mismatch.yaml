id: qr_payee_mismatch
severity: high
title_en: QR code pays a different person than the seller
title_ne: QR कोडले बिक्रेताबाट फरक व्यक्तिलाई पैसा पठाउँछ
description: The decoded QR shows a payee name that does not match the seller's claimed identity.
why_en: Money sent to a mismatched QR goes to someone else. The seller may be using another person's account.
why_ne: फरक नाममा पैसा पठाएपछि त्यो पैसा फर्काउन गाह्रो हुन्छ। बिक्रेता अरूको खाता प्रयोग गरेको हुन सक्छ।
not_always_scam_en: Family members sometimes share accounts. Ask the seller to confirm whose name is on the account.
keywords:
  - qr mismatch
  - qr payee
  - payee name
examples:
  - lang: en
    text: "QR decoded payee: SITA SHARMA (seller claimed: Ram Thapa)"
next_steps:
  - en: Ask the seller why the QR pays a different name. Do not pay until clarified.
    ne: बिक्रेताबाट सोध्नुहोस् QR फरक नाममा किन पठाउँछ। स्पष्ट नभएसम्म पैसा नतिरनुहोस्।