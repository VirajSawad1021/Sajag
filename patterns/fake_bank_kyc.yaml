id: fake_bank_kyc
severity: high
title_en: Fake bank or wallet staff asking for KYC update
title_ne: नकली बैंक वा वालेट कर्मचारीले KYC अपडेट माग्दा
description: Someone pretends to be from your bank, eSewa, Khalti, IME Pay, or other wallet, saying your KYC is expiring or needs update. They ask for OTP, documents, or to click a link.
why_en: Real banks and wallets never ask for OTP, full card details, or passwords via calls/messages. They direct you to their official app or branch.
why_ne: साँचो बैंक/वालेट कहिल्यै कल, म्यासेज वा लिङ्क मार्फत OTP, कार्ड विवरण वा पासवर्ड माग्दैनन्। उनीहरू आफ्नै आधिकारिक एप वा शाखामा जाने भन्छन्।
not_always_scam_en: Banks do send reminders to update KYC, but they never ask for OTP or passwords over phone/chat. Always use the official app.
keywords:
  - kyc update
  - kyc expire
  - kyc verify
  - bank staff
  - wallet staff
  - esewa staff
  - khalti staff
  - ime pay
  - केवाईसी
  - बैंक कर्मचारी
  - वालेट कर्मचारी
  - खाता बन्द हुन्छ
  - account band huncha
  - verify garna
examples:
  - lang: rom-ne
    text: "Namaste, ma eSewa bata boldechu. Tapaiko KYC expire bhayeko cha. OTP pathaunus verify garna."
  - lang: ne
    text: "नमस्ते, म Khalti बाट बोल्दैछु। तपाईंको खाता बन्द हुन लागेको छ। KYC अपडेट गर्न लिङ्कमा क्लिक गर्नुहोस्।"
  - lang: en
    text: "Hello, this is IME Pay. Your KYC is expiring. Share the OTP sent to your phone to verify."
next_steps:
  - en: Never share OTP, PIN, or passwords with anyone claiming to be bank/wallet staff.
    ne: बैंक/वालेट कर्मचारी भन्ने कसैसँग OTP, PIN वा पासवर्ड सेयर नगर्नुहोस्।
  - en: Open the official app yourself to check KYC status. Do not click links from messages.
    ne: आफै आधिकारिक एप खोलेर KYC अवस्था हेर्नुहोस्। म्यासेजका लिङ्कमा क्लिक नगर्नुहोस्।
  - en: Call the official customer care number (from the app/website) to verify.
    ne: आधिकारिक कस्टमर केअर नम्बरमा (एप/वेबसाइटबाट) फोन गरी पुष्टि गर्नुहोस्।
    resource: bank_or_wallet