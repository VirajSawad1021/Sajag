id: no_cod_or_verification
severity: medium
title_en: No cash on delivery, no video call, no way to verify
title_ne: COD छैन, भिडियो कल छैन, बिक्रेता पुष्टि गर्न सकिँदैन
description: The seller refuses COD, won't do a video call to show the item, and blocks any way for the buyer to verify before paying.
why_en: A seller who has nothing to hide will usually allow at least one way to verify. Refusing all verification is a strong signal.
why_ne: लुकाउनुपर्ने कुरा नभएको बिक्रेताले प्रायः कुनै न कुनै तरिकाले जाँच्न दिन्छ। सबै किसिमको जाँच अस्वीकार गर्नु ठगीको ठूलो संकेत हो।
not_always_scam_en: Some remote sellers genuinely cannot do COD or video calls. Check their history and reviews.
keywords:
  - cod mildaina
  - cod chaina
  - cod hudaina
  - no cod
  - video call mildaina
  - video call chaina
  - verify garna dina
  - COD हुँदैन
  - COD मिल्दैन
  - पुष्टि गर्न दिन्न
examples:
  - lang: rom-ne
    text: "COD mildaina dai, esewa ma pathaunus"
  - lang: rom-ne
    text: "COD chaina, video call pani hudaina. Paisa pathaunus matra option ho"
next_steps:
  - en: Ask for a live video call to see the item, with today's date written on paper. If they refuse, do not pay.
    ne: आजको मिति कागजमा लेखेर सामान लाइभ भिडियो कलमा देखाउन भन्नुहोस्। मानेनन् भने पैसा नतिर्नुहोस्।
  - en: Check if the seller has a physical shop or known social media presence.
    ne: बिक्रेताको भौतिक पसल वा चिनिएको सोशल मिडिया छ कि छैन हेर्नुहोस्।
