id: qr_checksum_invalid
severity: medium
detected_by: code
title_en: Payment QR looks edited or damaged
title_ne: भुक्तानी QR परिवर्तन गरिएको वा बिग्रिएको देखिन्छ
description: The checksum stored inside the payment QR does not match its contents. Detected by code, not by the model.
why_en: A QR whose contents were changed after it was generated can send money somewhere other than intended, for example a sticker placed over a shop's real QR.
why_ne: बनाइसकेपछि भित्रको विवरण बदलिएको QR ले पैसा अर्कै ठाउँमा पठाउन सक्छ, जस्तै पसलको असली QR माथि टाँसिएको नक्कली स्टिकर।
not_always_scam_en: A blurred or cropped screenshot can also break the checksum. Ask for a fresh QR, or pay by typing the verified ID.
keywords: []
examples: []
next_steps:
  - en: Don't pay with this QR. Ask the seller for a fresh QR, or type in the receiver's ID and check the name your app shows.
    ne: यो QR बाट भुक्तानी नगर्नुहोस्। नयाँ QR माग्नुहोस्, वा प्राप्तकर्ताको ID आफैं टाइप गरी एपले देखाएको नाम जाँच्नुहोस्।
