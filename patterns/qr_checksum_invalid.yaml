id: qr_checksum_invalid
severity: medium
title_en: QR code failed checksum (tampered or fake)
title_ne: QR कोडको चेकसम नमिल्यो (तोडिएको वा नकली)
description: The QR code data does not match its internal checksum, meaning the code was edited or generated incorrectly.
why_en: A valid payment QR always passes its checksum. A mismatch means someone tampered with it.
why_ne: सही भुक्तानी QR कोडको चेकसम कहिल्यै नमिल्न हुँदैन। नमिल्यो भने त्यो तोडिएको वा नकली हो।
not_always_scam_en: Rarely, a damaged or poorly printed QR can fail. If the image is clear and it still fails, treat it as suspicious.
keywords:
  - qr checksum
  - qr tampered
  - qr fake
examples:
  - lang: en
    text: "QR code checksum validation failed"
next_steps:
  - en: Do not scan this QR for payment. Ask the seller for a fresh QR from their official wallet/bank app.
    ne: यो QR ले पैसा नतिरनुहोस्। बिक्रेताबाट उनको आधिकारिक एप्बाट नयाँ QR माग्नुहोस्।